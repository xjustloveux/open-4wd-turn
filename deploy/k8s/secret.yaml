apiVersion: v1
kind: Secret
metadata:
  name: open4wd-turn-secret
type: Opaque
stringData:
  # 形狀樣板：本檔不被 workflow apply、不承載正式值。shared secret 不在此——它隨渲染後的
  # turnserver.conf 整份進 Secret open4wd-turn-conf（部署 workflow 以 --from-file 生成並掛載）。
  # TLS（turns:）啟用＝營運者手動建立／維護叢集內同名 Secret 的 tls.crt／tls.key
  # 並解除 deployment 對應掛載註解。
  tls.crt: ""
  tls.key: ""
