apiVersion: v1
kind: Service
metadata:
  name: open4wd-turn
spec:
  # hostNetwork 下流量不經 Service——此資源只作埠面宣告與營運者叢集內的服務發現名；
  # 不宣告任何 client 預設 endpoint。
  selector: { app: open4wd-turn }
  ports:
    - { name: stun-turn-udp, port: 3478, protocol: UDP }
    - { name: stun-turn-tcp, port: 3478, protocol: TCP }
    - { name: turns-tcp, port: 5349, protocol: TCP }
